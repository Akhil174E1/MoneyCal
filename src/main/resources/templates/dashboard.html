<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Money Tracker Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>

        body{
            background:#050505;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
        }

        .navbar{

            background:#101010;

            border-bottom:3px solid #198754;

            box-shadow:0px 2px 12px rgba(25,135,84,.4);

        }

        .card{

            background:#111;

            border:1px solid #198754;

            color:white;

            border-radius:15px;

            box-shadow:0px 0px 15px rgba(25,135,84,.25);

        }

        .form-control,
        .form-select{

            background:#202020;

            color:white;

            border:1px solid #198754;

        }

        .form-control:focus,
        .form-select:focus{

            background:#202020;

            color:white;

            border-color:#20c997;

            box-shadow:none;

        }

        .table{

            color:white;

        }

        .table thead{

            background:#198754;

        }

        .table tbody tr:hover{

            background:#1c1c1c;

        }

        .summary{

            font-size:32px;

            font-weight:bold;

        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <span class="navbar-brand fs-3">

            <i class="bi bi-wallet2"></i>

            Money Tracker

        </span>

        <a th:href="@{/logout}"

           class="btn btn-danger">

            <i class="bi bi-box-arrow-right"></i>

            Logout

        </a>

    </div>

</nav>


<div class="container mt-4">


<div class="row mb-4">

<div class="col-md-6">

<div class="card p-4 text-center">

<h5>Total Amount</h5>

<div class="summary text-success">

₹ <span th:text="${total}"></span>

</div>

</div>

</div>


<div class="col-md-6">



</div>

</div>


<div class="card p-4 mb-4">

<h3 class="text-success mb-4"

th:text="${moneyVo.id != null} ? 'Update Expense' : 'Add Expense'">

</h3>


<form

th:object="${moneyVo}"

th:action="${moneyVo.id != null} ?

@{'/entries/' + ${moneyVo.id} + '/update'} :

@{/entries}"

method="post">


<div class="row">


<div class="col-md-4">

<label class="mb-2">

Reason

</label>

<input

type="text"

th:field="*{reason}"

class="form-control"

placeholder="Enter Reason"

required>

</div>


<div class="col-md-3">

<label class="mb-2">

Amount

</label>

<input

type="number"

step="0.01"

th:field="*{amount}"

class="form-control"

placeholder="Enter Amount"

required>

</div>



<div class="col-md-2 d-grid">

<label>&nbsp;</label>

<button

class="btn btn-success">

<span

th:text="${moneyVo.id != null} ?

'Update' :

'Save'">

</span>

</button>

</div>

</div>

</form>

</div>


<div class="card p-3">

<h4 class="text-success mb-3">

Expense History

</h4>

<table class="table table-dark table-bordered table-hover">

<thead>

<tr>

<th>ID</th>

<th>Reason</th>

<th>Amount</th>



<th>Date</th>

<th width="180">

Action

</th>

</tr>

</thead>

<tbody>
<tr th:each="entry : ${entries}">

    <td th:text="${entry.id}"></td>

    <td th:text="${entry.reason}"></td>

    <td>
        ₹ <span th:text="${entry.amount}"></span>
    </td>

  

    <td th:text="${#dates.format(entry.date,'dd-MM-yyyy HH:mm')}"></td>

    <td>

        <!-- Edit Button -->

        <a th:href="@{'/entries/' + ${entry.id} + '/edit'}"
           class="btn btn-warning btn-sm">

            <i class="bi bi-pencil-square"></i>

            Edit

        </a>

        &nbsp;

        <!-- Delete Button -->

        <form
                th:action="@{'/entries/' + ${entry.id} + '/delete'}"
                method="post"
                style="display:inline;">

            <button
                    type="submit"
                    class="btn btn-danger btn-sm"

                    onclick="return confirm('Are you sure you want to delete this expense?');">

                <i class="bi bi-trash"></i>

                Delete

            </button>

        </form>

    </td>

</tr>

<tr th:if="${#lists.isEmpty(entries)}">

    <td colspan="6"
        class="text-center text-warning fs-5">

        <i class="bi bi-exclamation-circle"></i>

        No Expense Records Found

    </td>

</tr>

</tbody>

</table>

</div>

</div>

<footer class="text-center mt-5 mb-3 text-secondary">

    <hr class="border-success">

    <p>

        <i class="bi bi-wallet2"></i>

        Money Tracker © 2026

    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
