<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Money Tracker | Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

   <style>

body{
    background:#000;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, Helvetica, sans-serif;
}

.login-card{

    width:420px;

    background:#111;

    border-radius:15px;

    border:1px solid #5EF527;

    box-shadow:0px 0px 25px rgba(94,245,39,.8);

    color:white;

}

.logo{

    font-size:55px;

    color:#5EF527;

}

.form-control{

    background:#1d1d1d;

    border:1px solid #5EF527;

    color:white;

}

.form-control:focus{

    background:#1d1d1d;

    color:white;

    border-color:#5EF527;

    box-shadow:0px 0px 10px #5EF527;

}

.btn-success{

    background:#5EF527;

    border:none;

    color:#000;

    font-weight:bold;

}

.btn-success:hover{

    background:#74FF3B;

    color:#000;

}

a{

    color:#5EF527;

    text-decoration:none;

    font-weight:bold;

}

a:hover{

    color:#74FF3B;

}

.alert-success{

    background:#5EF527;

    color:#000;

    border:none;

}

hr{

    border-color:#5EF527;

}

</style>

</head>

<body>

<div class="card login-card p-4">

    <div class="text-center">

        <i class="bi bi-wallet2 logo"></i>

        <h2 class="text-success mt-2">
            Money Tracker
        </h2>

        <p class="text-secondary">
            Sign in to continue
        </p>

    </div>


    <!-- SUCCESS / ERROR MESSAGE -->

    <div th:if="${message}"

         class="alert"

         th:classappend="${isSuccess} ? ' alert-success' : ' alert-danger'">

        <span th:text="${message}"></span>

    </div>



    <!-- LOGIN FORM -->

    <form th:action="@{/login}" method="post">

        <div class="mb-3">

            <label class="form-label">

                <i class="bi bi-envelope-fill"></i>

                Email

            </label>

            <input

                    type="email"

                    name="email"

                    class="form-control"

                    placeholder="Enter your email"

                    required>

        </div>



        <div class="mb-4">

            <label class="form-label">

                <i class="bi bi-lock-fill"></i>

                Password

            </label>

            <input

                    type="password"

                    name="password"

                    class="form-control"

                    placeholder="Enter your password"

                    required>

        </div>



        <div class="d-grid">

            <button type="submit"

                    class="btn btn-success btn-lg">

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>

        </div>

    </form>

    <hr class="border-success">

    <div class="text-center">

        Don't have an account?

        <a th:href="@{/signup}">

            Sign Up

        </a>

    </div>

</div>

</body>

</html>
