<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Money Tracker | Sign Up</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
    background:#000;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.signup-card{

    width:430px;

    background:#111;

    color:white;

    border:1px solid #198754;

    border-radius:15px;

    box-shadow:0 0 20px rgba(25,135,84,.7);

}

.form-control{

    background:#222;

    color:white;

    border:1px solid #198754;

}

.form-control:focus{

    background:#222;

    color:white;

    border-color:#20c997;

    box-shadow:none;

}

.btn-success{

    background:#198754;

    border:none;

}

a{

    color:#20c997;

    text-decoration:none;

}

</style>

</head>

<body>

<div class="card signup-card p-4">

<div class="text-center mb-3">

<i class="bi bi-person-plus-fill text-success" style="font-size:55px;"></i>

<h2>Create Account</h2>

<p class="text-secondary">

Register to use Money Tracker

</p>

</div>

<div

th:if="${message}"

class="alert"

th:classappend="${isSuccess} ? 'alert-success' : 'alert-danger'">

<span th:text="${message}"></span>

</div>

<form th:action="@{/signup}" method="post">

<div class="mb-3">

<label>Email</label>

<input

type="email"

name="email"

class="form-control"

required>

</div>

<div class="mb-4">

<label>Password</label>

<input

type="password"

name="password"

class="form-control"

required>

</div>

<button

type="submit"

class="btn btn-success w-100">

Create Account

</button>

</form>

<hr class="border-success">

<div class="text-center">

Already have an account?

<a th:href="@{/login}">

Login

</a>

</div>

</div>

</body>

</html>
